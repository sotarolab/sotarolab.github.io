# /research/ — the whole page, one section per entry.
#
# content/research.md is GENERATED from this file by tools/gen_research.py —
# never edit it there; `make check` fails if the two drift.
#
#   edit this file  →  make research  →  preview at localhost:1313
#
# Each section takes:
#   title:    section heading (required)
#   id:       optional HTML anchor, e.g. for cross-links like /research/#live-forecast-platforms
#   text:     markdown prose. **bold**, links, and raw HTML all work.
#   figures:  optional list of media under the prose. Three kinds:
#
#     - video: /media/research/clip.mp4          # rendered as a lazy-loading,
#       poster: /media/research/clip-poster.jpg  # off-screen-paused player
#       ratio: 1280/1100                         # width/height of the file
#       alt: "Plain-language description for screen readers."
#       caption: |                               # HTML allowed (<b>, &nbsp;, …)
#         <b>Bold lead-in.</b> One or two sentences.
#
#     - image: /media/research/figure.png        # same card layout, static
#       ratio: 1600/900
#       alt: "…"
#       caption: |
#         …
#
#   Optional sizing on video/image figures (default is the 560px card):
#       width: 680px    # any CSS length — this figure's own max width
#       wide: true      # full rail, for panoramic figures illegible small
#
#     - html: |                                  # escape hatch: raw markup,
#         <figure>…</figure>                     # passed through untouched
#
# Replacing a video or image = drop the new file in static/media/…, update the
# path here, run `make research`. `make check` verifies every referenced path
# actually exists in the built site.
#
# Multiple video/image figures in one section render side by side in one strip.
# The strip's layout, lazy-loading and off-screen pause live in
# assets/js/research-strip.js + assets/css/custom/06-figures.css, keyed to the
# `.rstrip` classes the generator emits.

page:
  title: 'Research'
  summary: >-
    Machine learning for weather and hydrologic forecasting — climate
    downscaling, streamflow during atmospheric-river floods, and
    boundary-layer meteorology in complex terrain.
  date: 2026-08-09
  spacing: '4rem'

sections:
  - title: 'Research'
    text: |
      I am trained in fluid dynamics, atmospheric boundary layers, and turbulent flows 
      in complex terrain, particularly, how these phenomena are represented in numerical 
      weather prediction (NWP) models. To tackle this problem, I leverage
      a wide array of scientific instrumentation platforms including in-situ
      and remote sensing, as well as operational weather forecast and climate models.  
  
      I also have hydraulics and hydrology expertise and professional experience building 
      water models for urban and natural systems to assess flood risk during wet weather
      events under current and future climate scenarios for resiliency in water utilities. 

  # --- Thread 1 ---------------------------------------------------------------
  #
  # Figure from ~/dev/chile-super-extremes/paper/agu2026/figures/
  # fig_downscaled_0p05.png (copied 2026-08-14) — the AGU-styled export.
  # Companions in that folder if this ever changes: fig_agu_combined (adds
  # the 1° CMIP6 baseline above this panel — the coarse-vs-fine pairing, but
  # poster-tall with baked captions) and fig_agreement_1deg.
  - title: 'Downscaling CMIP6 Projections over Chile'
    text: |
      Collaborative research with Chile and US researchers training a
      convolutional neural network to downscale CMIP6-based climate projections
      of extreme precipitation and temperature in Chile. The CNN is able to
      capture Chile's unique topography, and we are investigating the physical
      mechanisms driving the changes so the methodology can be applied to other
      regions. An abstract on this work is submitted to the
      [AGU Fall Meeting 2026](/publications/agu2026-cmip6-downscaling-chile/),
      with a journal manuscript in preparation for *Climate Dynamics*.
    figures:
      - image: /media/research/chile-cnn-downscaled.png
        ratio: 2752/3694
        width: 680px  # between the 560 card and the full rail — full rail
                      # made this tall figure dominate the section
        alt: >-
          Six maps of Chile at 0.05-degree resolution showing CNN-downscaled
          change from 1981–2010 to 2071–2100 under SSP5-8.5: the top row is
          the change in maximum one-day precipitation for NESM3, the 27-model
          ensemble mean, and HadGEM3-GC31-LL; the bottom row is the change in
          maximum temperature for INM-CM5-0, the 26-model ensemble mean, and
          UKESM1-0-LL, with fine Andean structure visible in every panel.
        caption: |
          <b>CNN-downscaled change at 0.05° (~5 km).</b> Rx1day (top) and TXx
          (bottom), 2071–2100 under SSP5-8.5 minus 1981–2010 — the ensemble
          mean flanked by the models that bracket it. The native CMIP6 grids
          are ~1°; the CNN restores the Andean structure the extremes
          actually follow.

  # --- Thread 2 ---------------------------------------------------------------
  # `id` exists so the About-strip caption can deep-link this section.
  # The Guerneville animation moved here from the About (2026-08-14, trimming
  # the landing page) — it is this thread's subject matter: an AR flood in a
  # US west coast basin, reconstructed by Sebastian's shallow-water solver.
  - title: 'Streamflow Prediction during Atmospheric-River Floods'
    id: streamflow-ar-floods
    text: |
      Applying Long Short-Term Memory (LSTM) and diffusion algorithms to predict
      flow discharges in US west coast basins, and stress testing them for flood
      events during atmospheric river events. We are benchmarking the results
      against process-based models (GR4J and CemaNeige) for basins associated
      with various hydrological regimes. An abstract on this work is submitted
      to the [AGU Fall Meeting 2026](/publications/agu2026-lstm-diffusion-ar-floods/),
      with a journal manuscript in preparation for the *Journal of Hydrology*.
    figures:
      - video: /media/research/guerneville-flood.mp4
        poster: /media/research/guerneville-flood-poster.jpg
        ratio: 1280/640
        wide: true
        alt: >-
          Animated shallow-water simulation of the February 2019 Russian River
          flood at Guerneville, California, water depth spreading across the
          floodplain over shaded terrain.
        caption: |
          <b>Russian River at Guerneville, CA — Feb 2019.</b> A shallow-water
          solver reconstructing an atmospheric-river flood on a 20&nbsp;m
          grid — the kind of event the LSTM and diffusion models are
          stress-tested against.
      # From ~/dev/caudal/paper/agu26/figures/fig_agu_abc.png (copied
      # 2026-08-14) — the AGU-styled export, chosen over the notebook-04
      # inline figures after their small fonts proved illegible at page
      # width. Companions in that folder if this ever changes: fig_agu_single
      # (adds the study-area map), fig_lstm_vs_nwm_scatter (panels A/B only).
      - image: /media/research/caudal-lstm-nwm-abc.png
        ratio: 3063/2457
        wide: true
        alt: >-
          Three-panel comparison of a regional LSTM against the National
          Water Model over about 70 US west coast basins: scatters of
          whole-record NSE and NSE on atmospheric-river days, both with most
          basins above the 1:1 line favouring the LSTM, and a bar chart of
          median relative peak error on AR floods by method, where the LSTM
          ensemble mean is worst at 0.407 and the train-selected q75 LSTM is
          best at 0.221, ahead of the National Water Model's 0.253.
        caption: |
          <b>The ranking depends on the question.</b> The regional LSTM beats
          the NWM v3.0 retrospective on skill — whole-record and on AR
          days — yet its ensemble mean is the worst peak estimator on AR
          floods; reading the ensemble at q75 overtakes the NWM. From the
          LSTM/diffusion benchmarking study.

