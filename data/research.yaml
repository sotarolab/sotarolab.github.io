  # --- Thread 4 ---------------------------------------------------------------
  #
  # The live mountain-wave canvas (Queney solution, assets/js/mountain-waves.js)
  # was removed from this section 2026-08-16: with a real deployment photo and
  # three observation figures, the theory animation read as decoration. The JS
  # stays on disk but is no longer bundled (custom-assets.html) — to restore,
  # re-add it there and re-add the html figure (see git history / the mtw-*
  # rules still in 06-figures.css).
  - title: 'Boundary-Layer Meteorology in Complex Terrain'
    text: |
      My doctoral work, and the origin of most of the publication record. I
      participated in two major experiments — the Wind Forecast Improvement
      Project 2 (WFIP2) in the Columbia River Gorge (OR) and the Sundowner Winds
      Experiment (SWEX) in Santa Barbara (CA) — deploying flux towers and
      Doppler lidars and processing their observations to study the skill of
      weather forecasting models in complex terrain. The main results, examining
      the subgrid variability of surface layer turbulence from 18 months of
      observational data benchmarked against the WRF model, are published in
      [*Boundary-Layer Meteorology*](/publications/2023-blm-subgrid-variability/).
    figures:
      # Slimmed twice on 2026-08-16 (Sebastian: section was "too heavy on
      # the boundary layer", risked reading "too broad", and the time series
      # "feels too dense"): now ONE published-WFIP2 figure + ONE SWEX thesis
      # figure. Cut but still in the archive folders (which SHIP publicly
      # even unreferenced — delete if that ever matters): the ridge
      # lidar/ceilometer photo, the 3D coplanar scan, the scan-line terrain
      # map, domain maps, and both WFIP2 time series.
      # WFIP2 — the published record (Boundary-Layer Meteorology 2023);
      # the SWEX figure below it is thesis work.
      - image: /media/research/wfip2/terrain_comparisson_real_vs_NWP_model.png
        ratio: 651/282
        # NB: source is only 651px wide, so full-rail display upscales it
        # ~1.2x — acceptably soft. A higher-res export would sharpen it.
        wide: true
        alt: >-
          Side-by-side terrain comparison for WFIP2: real high-resolution
          terrain with the tower array circled and a dozen tower positions
          marked, beside the same area as the weather model's grid, where
          the terrain is a handful of smooth coloured cells.
        caption: |
          <b>What the model sees.</b> The WFIP2 tower array on real terrain
          (left) and the same ground in the NWP model's grid (right) — a
          dozen towers sampling terrain the model resolves as a few smooth
          cells. The turbulence variability inside that circle is what the
          <a href="/publications/2023-blm-subgrid-variability/"><i>Boundary-Layer
          Meteorology</i> paper</a> quantifies.
      # Combined from instruments/picture_lidar_01.jpeg +
      # picture_SYA_tower_01.jpeg (matched heights, white gutter) by a small
      # PIL one-liner, 2026-08-16 — Sebastian wanted the instruments back as
      # one figure rather than two.
      - image: /media/research/SWEX/instruments/lidar_and_tower.jpeg
        ratio: 1019/559
        alt: >-
          Two photographs side by side: a ceilometer and a scanning Doppler
          lidar deployed on a ridge above Santa Barbara with the Pacific
          Ocean behind, and an instrumented flux tower standing in a grassy
          field site.
        caption: |
          <b>The instruments.</b> Scanning Doppler lidar and ceilometer on
          the ridge above Santa Barbara (left) and a flux tower at the
          valley site (right), deployed for SWEX — the platforms behind the
          scans below.
      # Panel (a) of the same thesis figure as the scan sequence below it —
      # the sequence's panels are labelled (b)–(f), so this map is what "(a)"
      # refers to. If this figure is ever cut again, the labels in
      # Lidar_new.png need cropping out or the reference dangles.
      - image: /media/research/SWEX/Results/terrain_new.png
        ratio: 524/312
        alt: >-
          Grayscale terrain map of the Santa Ynez valley with the SYA lidar
          site marked and a straight line through it showing the range–height
          scan track along azimuth 315 degrees, labelled as panel a.
        caption: |
          <b>The scan line.</b> RHI track along azimuth 315° through the SYA
          site — the transect the scans below sweep.
      - image: /media/research/SWEX/Results/Lidar_new.png
        ratio: 874/820
        wide: true
        alt: >-
          Sequence of five range–height lidar scans along azimuth 315 degrees
          through the night of 21–22 April 2020, each showing a shallow yellow
          outflow layer near 400 metres over blue return flow.
        caption: |
          <b>One night, scan by scan.</b> Doppler-lidar range–height scans
          along azimuth 315° through the SYA site in the Santa Ynez valley,
          over the night of 21–22 April: a shallow downslope jet rides a few
          hundred metres above the lidar while the opposing layer holds
          beneath it. From the SWEX campaign.
