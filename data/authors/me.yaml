# Rendered as the first timeline on /cv/. List most recent first.
# Fields: role (or `position`), org (or `company_name`), start, end, summary,
#         icon, tags (list of strings), button {url, text, icon}.
# Set `end: ''` for a current role — it renders as "Present".
#
# Sourced from Sebastian_Otarola-Bustos_CV_human.pdf, following that document's
# own section order: Professional Experience, then Research & Independent
# Projects, then Research Experience. Bulleted like the CV itself (2026-08-15,
# Sebastian's request) rather than condensed into paragraphs.
#
# CONFIDENTIALITY: client and funder names in the CV are deliberately NOT
# reproduced here. The CV names a sewer district, a city, and a funded project
# number; this page says "a research-foundation study" and "a framework"
# instead. A CV goes to one reader who asked for it; this page is crawlable.
# Do not add client names, project numbers, or repository links back in.
#
# `tags` makes industry vs. independent vs. academic legible at a glance.
experience:
  # --- Professional Experience ---
  - role: 'Principal Scientist'
    org: 'Hazen, Silver Spring, MD'
    start: 'Aug 2022'
    end: ''
    summary: |
      - Develop and calibrate hydraulic and hydrologic models for utilities and
        water districts across the US, supporting regulatory compliance, flood
        analysis, water supply management, and capital improvement planning in
        urban and natural systems.
      - Lead machine learning work in classification, regression, and anomaly
        detection: wet-weather influent flow forecasting, urban flooding
        detection, and water demand forecasting, following version-controlled
        development practice and modern ML frameworks.
      - Contributed to a framework for building and calibrating parsimonious
        (sparse-parameter) hydrological models in Python, aimed at flooding in
        stormwater systems.
      - Led data analysis and web tool development for a research-foundation
        study of water quality in quarry lakes, screening about 500,000 US lakes
        from in-situ and remote sensing records as alternative supply storage.
    tags: ['Industry']
    icon: 'briefcase'

  # --- Research & Independent Projects ---
  - role: 'Research & Independent Projects'
    org: 'Self-directed'
    start: '2025'
    end: ''
    summary: |
      - Collaborative research with Chile and US researchers training a
        convolutional neural network to downscale CMIP6-based projections of
        extreme precipitation and temperature over Chile, and investigating the
        physical mechanisms driving the changes so the method can transfer to
        other regions.
      - Applying Long Short-Term Memory (LSTM) and diffusion algorithms to
        predict flow discharges in US west coast basins, stress-tested on
        atmospheric-river flood events and benchmarked against process-based
        models (GR4J and CemaNeige) across hydrological regimes.
      - Maintain two public platforms with live ingestion from operational
        forecast models and observation networks, plus a bias-correction
        pipeline that calibrates the forecasts: a US heat-wave tracker covering
        major airports, and an atmospheric river tracker following weather
        stations and flood alerts in Chile.
    tags: ['Independent']
    icon: 'code-bracket'

  # --- Research Experience ---
  - role: 'PhD Researcher, Atmospheric Fluid Dynamics'
    org: 'University of Notre Dame'
    start: 'Aug 2016'
    end: 'May 2022'
    summary: |
      - Participated in two major field experiments: the Wind Forecast
        Improvement Project 2 (WFIP2) in the Columbia River Gorge (OR) and the
        Sundowner Winds Experiment (SWEX) in Santa Barbara (CA), deploying flux
        towers and Doppler lidars and processing their observations to study the
        skill of weather forecasting models in complex terrain.
      - Published the WFIP2 results in *Boundary-Layer Meteorology*, on the
        subgrid variability of surface layer turbulence in complex terrain from
        18 months of observations, benchmarked against the WRF model.
      - Collaborated on peer-reviewed publications in boundary layer meteorology
        and wind energy, produced open datasets published in the DOE Atmosphere
        to Electrons archive, and presented at national and international
        conferences.
    tags: ['Academic']
    icon: 'academic-cap'

