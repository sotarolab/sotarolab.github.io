bio: |
  Sebastian Otarola-Bustos, PhD, is a machine learning and atmospheric scientist
  focused on weather extremes — heat waves, forecast bias correction, and
  satellite-based reconstruction of surface observations. He builds ML tools
  and live dashboards that turn NWP forecasts, reanalysis, and satellite
  retrievals into actionable extreme-weather intelligence, and is looking to
  bring that work to a national laboratory setting.

