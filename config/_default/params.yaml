# ══════════════════════════════════════════════════════════════════════════════.
hugoblox:
  schema: "2.0"

  # ────────────────────────────────────────────────────────────────────────────.
  identity:
    # Site name - shown in navbar, footer, copyright, and browser title by default
    name: "Sebastian Otarola-Bustos"
    # Legal entity for copyright notices (defaults to name if not set)
    organization: ""
    # Schema.org type for structured data
    type: person # person | organization | local_business
    # Short tagline displayed on your site.
    # Keep in sync with `role:` in data/authors/me.yaml — they drifted before.
    tagline: "Machine Learning, Hydrology & Atmospheric Science"
    # Site meta description for search engines and social sharing
    description: "Applied research at the intersection of weather and hydrologic
      forecasting, climate change, remote sensing, and machine learning."
    # Social accounts (used for meta tags like Twitter Cards)
    social: {}

  # ────────────────────────────────────────────────────────────────────────────.
  theme:
    # Mode: 'light', 'dark', or 'system' (follows OS preference)
    mode: dark
    # Theme pack: name from data/themes/ or { light: "x", dark: "y" } for mix-and-match
    # "primer" is this project's own pack — GitHub's colour system.
    # See data/themes/primer.yaml.
    pack: "primer"
    # Optional: Override theme pack colors
    colors:
      primary: "" # Tailwind palette name or hex (e.g., "indigo" or "#6366f1")
      secondary: ""
      neutral: "" # Affects gray utilities (text-gray-*, bg-gray-*)
    # Optional: Mode-specific color overrides
    colors_light: {}
    colors_dark: {}
    # Optional: Semantic surface color overrides
    surfaces:
      background: ""
      foreground: ""
      header:
        background: ""
        foreground: ""
      footer:
        background: ""
        foreground: ""

  # ────────────────────────────────────────────────────────────────────────────.
  typography:
    # Theme pack: name from data/fonts/.
    pack: "modern"

  # ────────────────────────────────────────────────────────────────────────────.
  layout:
    # Border radius: 'none', 'sm', 'md', 'lg', or 'full'
    # 'sm' — squarer corners read more like a document, less like an app UI
    radius: "sm"
    # Spacing density: 'compact', 'comfortable', or 'spacious'
    # 'compact' — 'spacious' left large vertical gaps between blocks
    spacing: "compact"
    # Avatar shape in author profiles
    avatar_shape: circle # circle | square | rounded

  # ────────────────────────────────────────────────────────────────────────────.
  header:
    enable: true
    # Header style variant
    style: navbar # navbar | navbar-simple | minimal
    # Stick to top on scroll
    sticky: true
    # Menu alignment
    align: left # left | center | right
    # Feature toggles
    # Search removed: six nav items and ~17 pages, all of them two
    # clicks away, and the one plausible query — finding a paper by keyword —
    # is answered by the Publications page listing everything on one screen.
    # Paired with `search.enable` below; the icon and the feature are separate
    # switches, and turning off only one leaves a magnifier that finds nothing.
    search: false
    # Dark only. The site is designed dark: the figures ship dark.
    theme_toggle: false
    # Theme picker and language switcher disabled — visitor-facing clutter on a
    # single-language personal site.
    theme_picker: false
    language_switcher: false
    # Call-to-action button
    cta:
      enable: false
      text: ""
      url: ""

  # ────────────────────────────────────────────────────────────────────────────.
  footer:
    # Footer style variant
    style: minimal # minimal | columns | centered
    language_switcher: false
    # Custom footer text (HTML supported)
    text: ""

  # ────────────────────────────────────────────────────────────────────────────.
  copyright:
    # Copyright notice - supports {year}, {name}, {license} placeholders
    notice: "© {year} {name}. This work is licensed under {license}"
    license:
      type: cc # cc | custom
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

  # ────────────────────────────────────────────────────────────────────────────.
  seo:
    # Browser tab title override (defaults to identity.name if not set)
    title: ""
    # For local_business identity type only
    location:
      address:
        street: ""
        city: ""
        region: ""
        postal_code: ""
        country: ""
      coordinates:
        latitude: null
        longitude: null
      phone: ""
    # AI/LLM crawler guidance (llms.txt)
    ai:
      allow:
        - /
      disallow: []
      note: "Guidance for AI crawlers - customize to match your public content."
      contact: ""

  # ────────────────────────────────────────────────────────────────────────────.
  content:
    # Math rendering
    math:
      enable: false
    # Table of contents
    toc:
      enable: true
    # Reading time estimates
    reading_time:
      enable: true
    # Academic citations
    citations:
      style: apa # apa | mla | chicago | ieee

  # ────────────────────────────────────────────────────────────────────────────.
  search:
    # Off — see the note on `hugoblox.header.search`. This also stops the
    # Pagefind index being built and the search bundle being shipped.
    enable: false
    # Trending/suggested search terms
    suggestions: []
    # Quick action shortcuts in search modal
    quick_actions: []

  # ────────────────────────────────────────────────────────────────────────────.
  comments:
    enable: false
    provider: "" # giscus | disqus
    giscus:
      repo: ""
      repo_id: ""
      category: ""
      category_id: ""
    disqus:
      shortname: ""

  # ────────────────────────────────────────────────────────────────────────────.
  analytics:
    google:
      measurement_id: "" # Google Analytics 4: G-XXXXXXXXXX
    google_tag_manager:
      container_id: "" # GTM-XXXXXXX
    plausible:
      domain: ""
    fathom:
      site_id: ""
    pirsch:
      site_id: ""
    clarity:
      project_id: ""
    baidu:
      site_id: ""

  # ────────────────────────────────────────────────────────────────────────────.
  verification:
    google: ""
    bing: ""
    baidu: ""
    yandex: ""
    pinterest: ""
    naver: ""

  # ────────────────────────────────────────────────────────────────────────────.
  repository:
    enable: false
    url: "" # e.g., https://github.com/username/repo
    branch: main
    content_dir: content

  # ────────────────────────────────────────────────────────────────────────────.
  locale:
    date_format: "Jan 2, 2006" # Go time format
    time_format: "3:04 PM"
    address_format: en-us

  # ────────────────────────────────────────────────────────────────────────────.
  security:
    csp:
      policy: ""
      report_only: false
    frame_options: allow # deny | sameorigin | allow - allow enables iframe embedding
    permissions_policy: ""

  # ────────────────────────────────────────────────────────────────────────────.
  privacy:
    enable: false
    anonymize_analytics: true

  # ────────────────────────────────────────────────────────────────────────────.
  debug:
    enable: false
    hud:
      position: bottom-left # top-left | top-right | bottom-left | bottom-right
      opacity: 1.0
    export_logs: true

  # ────────────────────────────────────────────────────────────────────────────.
  pro:
    # Hide "Powered by HugoBlox" attribution.
    hide_attribution: false

    # Affiliate referral code for rewards program
    # Join affiliate program: https://hugoblox.com/affiliates
    affiliate_code: ""
