# Navigation Links
#   To link a homepage section, specify the URL as a hash `#` followed by the
#     block `id` set in `content/_index.md`.
#   The weight parameter defines the order that the links will appear in.
#
# Research and Projects are deliberately separate: Research is what the work
# studies (with its figures), Projects is what is built and running. The
# `Live Forecast Platforms` thread on /research/ links across to /projects/.
#
# /blog/ exists but is unlinked while it has a single post.

main:
  - name: About
    url: /
    weight: 10
  - name: Research
    url: research/
    weight: 20
  - name: Projects
    url: projects/
    weight: 30
  - name: Publications
    url: publications/
    weight: 40
  - name: Teaching
    url: teaching/
    weight: 50
  - name: CV
    url: cv/
    weight: 60
